<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autotex 3D Colour Studio</title>
  
  <!-- Modern Clean Typography (Matching autotex.net) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Mulish:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="studio-only-mode">

  <main class="studio-standalone-wrapper">
    <div class="container studio-container">

      <!-- Product Selector Navigation Tabs -->
      <div class="product-selector-bar" role="tablist" aria-label="Select Product Profile">
        <button class="prod-tab active" data-model="d-spring" role="tab" aria-selected="true">
          <span class="tab-code">01</span>
          <div class="tab-info">
            <strong class="tab-title">D-SPRING</strong>
            <small class="tab-sub">Compressible Tube</small>
          </div>
          <span class="tab-active-indicator"></span>
        </button>

        <button class="prod-tab" data-model="d-stiff" role="tab" aria-selected="false">
          <span class="tab-code">02</span>
          <div class="tab-info">
            <strong class="tab-title">D-STIFF</strong>
            <small class="tab-sub">Rigid Barrel</small>
          </div>
          <span class="tab-active-indicator"></span>
        </button>

        <button class="prod-tab" data-model="d-stack" role="tab" aria-selected="false">
          <span class="tab-code">03</span>
          <div class="tab-info">
            <strong class="tab-title">D-STACK</strong>
            <small class="tab-sub">Stackable Spindle</small>
          </div>
          <span class="tab-active-indicator"></span>
        </button>

        <button class="prod-tab" data-model="d-cone" role="tab" aria-selected="false">
          <span class="tab-code">04</span>
          <div class="tab-info">
            <strong class="tab-title">D-CONE</strong>
            <small class="tab-sub">Perforated Dye Cone</small>
          </div>
          <span class="tab-active-indicator"></span>
        </button>

        <button class="prod-tab" data-model="s-cone" role="tab" aria-selected="false">
          <span class="tab-code">05</span>
          <div class="tab-info">
            <strong class="tab-title">S-CONE</strong>
            <small class="tab-sub">Sale Yarn Velvet Cone</small>
          </div>
          <span class="tab-active-indicator"></span>
        </button>
      </div>

      <!-- Main Studio Grid -->
      <div class="studio-grid">

        <!-- Left Column: Interactive 360° Render Stage -->
        <div class="studio-viewport-panel" id="viewport-panel">

          <!-- The Render Stage Container -->
          <div class="viewport-stage" id="stage-viewport">
            
            <!-- Floating Inspection Toolbar (Reset, Focus Top/Center/Base, Zoom) -->
            <div class="stage-floating-toolbar stage-reset-bar">
              <div class="stage-tool-group">
                <button id="btn-reset-view" class="tool-btn reset-single-btn" title="Reset 360° Angle and Zoom">
                  <span class="tool-icon">↺</span>
                  <span class="tool-label">Reset</span>
                </button>
              </div>

              <div class="stage-tool-divider"></div>

              <div class="stage-tool-group" role="group" aria-label="Feature Inspection Focus">
                <button id="btn-focus-top" class="tool-btn focus-pill-btn" title="Focus and inspect Top Rim">
                  <span class="tool-label">Top</span>
                </button>
                <button id="btn-focus-mid" class="tool-btn focus-pill-btn active" title="Focus and inspect Center Body">
                  <span class="tool-label">Center</span>
                </button>
                <button id="btn-focus-base" class="tool-btn focus-pill-btn" title="Focus and inspect Bottom Base">
                  <span class="tool-label">Base</span>
                </button>
              </div>

              <div class="stage-tool-divider"></div>

              <div class="stage-tool-group" role="group" aria-label="Zoom Controls">
                <button id="btn-zoom-in" class="tool-btn zoom-btn" title="Zoom In (+)">
                  <span class="tool-icon">+</span>
                </button>
                <span class="zoom-level-badge" id="zoom-badge">100%</span>
                <button id="btn-zoom-out" class="tool-btn zoom-btn" title="Zoom Out (−)">
                  <span class="tool-icon">−</span>
                </button>
              </div>
            </div>

            <!-- Single Stage 360° Viewport -->
            <div class="stage-single" id="stage-single">
              
              <!-- 3D Turntable Base Ring -->
              <div class="turntable-floor-ring">
                <div class="floor-tick tick-0">0°</div>
                <div class="floor-tick tick-90">90°</div>
                <div class="floor-tick tick-180">180°</div>
                <div class="floor-tick tick-270">270°</div>
                <div class="floor-grid-circle"></div>
              </div>

              <!-- Real 3D WebGL Canvas for 360 Degree Solid Cylinder/Cone Rotation -->
              <canvas id="threejs-canvas" class="threejs-canvas"></canvas>

              <!-- Fallback 2D Image Stage -->
              <div class="product-render-stage" id="main-render-stage" style="display: none;">
                <div class="stage-pedestal-shadow" id="stage-shadow"></div>
                <div class="product-glare-overlay" id="product-glare"></div>
                <img id="product-display-img" src="Image/tints/d-spring_R3020.png" alt="Autotex Configured Product" class="product-display-img">
                <canvas id="product-custom-canvas" class="product-custom-canvas" style="display: none;"></canvas>
              </div>

            </div>

            <!-- Comparison View (Side-by-Side) -->
            <div class="stage-compare" id="stage-compare" style="display: none;">
              <!-- Primary Item -->
              <div class="compare-column active-compare-slot" id="compare-col-a" style="cursor: pointer;" title="Click to choose shade for Selection A">
                <div class="compare-tag">SELECTION A</div>
                <div class="compare-render-stage">
                  <div class="stage-pedestal-shadow small"></div>
                  <canvas id="compare-canvas-a" class="product-display-img product-custom-canvas" width="200" height="400"></canvas>
                  <img id="compare-display-a" src="Image/tints/d-spring_485_C.png" alt="Selection A" class="product-display-img" style="display: none;">
                </div>
                <div class="compare-info">
                  <strong id="compare-name-a">Vivid Red</strong>
                  <span id="compare-code-a">Pantone 485 C</span>
                </div>
              </div>

              <div class="compare-vs-badge">VS</div>

              <!-- Secondary Item -->
              <div class="compare-column" id="compare-col-b" style="cursor: pointer;" title="Click to choose shade for Candidate B">
                <div class="compare-tag">CANDIDATE B</div>
                <div class="compare-render-stage">
                  <div class="stage-pedestal-shadow small"></div>
                  <canvas id="compare-canvas-b" class="product-display-img product-custom-canvas" width="200" height="400"></canvas>
                  <img id="compare-display-b" src="Image/tints/d-spring_662_C.png" alt="Candidate B" class="product-display-img" style="display: none;">
                </div>
                <div class="compare-info">
                  <strong id="compare-name-b">Deep Blue</strong>
                  <span id="compare-code-b">Pantone 662 C</span>
                </div>
              </div>
            </div>

          </div>

        </div>


        <!-- Right Column: Colour Palette & Masterbatch Library -->
        <div class="studio-palette-panel">
          
          <div class="palette-top">
            <div>
              <p class="panel-eyebrow">OFFICIAL SUPPLY SHADES</p>
              <h3 class="panel-title">Masterbatch Palette</h3>
            </div>
            <span class="palette-counter" id="palette-count-badge">20 SHADES</span>
          </div>

          <!-- Quick Action Controls: Compare Two Shades & Dark Mill Stage -->
          <div class="palette-quick-actions">
            <button id="btn-toggle-compare" class="btn-studio-action" title="Compare two shades side by side" aria-pressed="false">
              <span class="action-icon">⮂</span>
              <span id="compare-btn-text">Compare Two Shades</span>
            </button>
            <button id="btn-toggle-backdrop" class="btn-studio-action" title="Toggle Dark Mill Stage contrast" aria-pressed="false">
              <span class="action-icon" id="backdrop-action-icon">🌙</span>
              <span id="backdrop-btn-text">Dark Mill Stage</span>
            </button>
          </div>

          <!-- Swatches Grid (All 20 Shades in Single View) -->
          <div class="swatches-container">
            <div class="swatches-grid" id="swatches-grid" role="radiogroup" aria-label="Colour Swatches">
              <!-- 20 Swatch items inserted via JavaScript -->
            </div>
          </div>

          <!-- Active Selection Detail -->
          <div class="selection-summary-card">
            <div class="selected-product-header">
              <div class="summary-chip" id="summary-color-chip" style="background-color: #DD2B1C;"></div>
              <div class="summary-details">
                <h4 id="summary-title">Vivid Red · 485 C</h4>
                <p id="summary-pdf-label" class="summary-code">Pantone 485 C | Vivid Red</p>
              </div>
              <span class="summary-supply-badge">Official Supply</span>
            </div>
          </div>

        </div>

      </div>

    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast-notification" role="status" aria-live="polite"></div>

  <!-- Three.js 3D Engine for Authentic 360° Cylindrical & Conical Meshes -->
  <script src="three.min.js"></script>
  <!-- GLTF Loader for Real Factory CAD Models (.glb) -->
  <script src="GLTFLoader.js"></script>
  <!-- Offline Factory CAD Bundle (Allows running directly on local file:/// with zero CORS issues) -->
  <script src="models/cad_bundle.js"></script>
  <!-- Main Application Script -->
  <script src="app.js?v=pantone_v1"></script>
</body>
</html>
